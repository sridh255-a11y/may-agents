<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAY Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="app" id="app">

  <aside class="side left" id="left">
    <div class="brand">
      <div class="logo">M</div>
      <span class="brand-name">MAY</span>
      <button class="icon-btn" id="collapse" title="Collapse sidebar" aria-label="Collapse sidebar">&#8249;</button>
    </div>
    <div class="label">Projects</div>
    <nav class="projects" id="projects">
      <div class="skeleton"></div>
      <div class="skeleton short"></div>
    </nav>
    <div class="spacer"></div>
    <div class="util">
      <button class="nav-btn" id="refresh">&#8635; Refresh</button>
      <button class="nav-btn" id="logout">&#9211; Disconnect</button>
      <button class="nav-btn" disabled>&#9881; Settings (soon)</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn only-mobile" id="open-left" aria-label="Open menu">&#9776;</button>
      <div class="greet">
        <h1 id="greeting">Welcome back</h1>
        <p class="muted small" id="subtitle">Your AI control system</p>
      </div>
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting...</span></div>
      <button class="icon-btn only-mobile" id="open-right" aria-label="Open agents">&#9881;</button>
    </div>

    <section class="core">
      <div class="orb" id="orb" data-state="disconnected">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="g" cx="40%" cy="35%" r="70%">
              <stop offset="0" stop-color="#a5e9ff"/>
              <stop offset=".45" stop-color="#22d3ee"/>
              <stop offset="1" stop-color="#6d3df0"/>
            </radialGradient>
          </defs>
          <circle class="halo" cx="100" cy="100" r="96"/>
          <g class="ring r1"><circle cx="100" cy="100" r="90"/></g>
          <g class="ring r2"><circle cx="100" cy="100" r="76"/></g>
          <g class="ring r3"><circle cx="100" cy="100" r="62"/></g>
          <g class="dots">
            <circle cx="100" cy="14" r="2.5"/><circle cx="186" cy="100" r="2"/>
            <circle cx="100" cy="186" r="2.5"/><circle cx="14" cy="100" r="2"/>
          </g>
          <g class="core"><circle cx="100" cy="100" r="40" fill="url(#g)"/></g>
        </svg>
      </div>
      <div class="orb-label" id="orb-label">Disconnected</div>
    </section>

    <section class="command">
      <div class="command-row">
        <input type="text" id="command" placeholder="Ask MAY to do something..." autocomplete="off" aria-label="Command">
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="quick" id="quick">
        <button class="btn secondary" data-cmd="status">Status</button>
        <button class="btn secondary" data-cmd="today">Today</button>
        <button class="btn secondary" data-cmd="report">Report</button>
      </div>
      <p class="error" id="command-error" role="alert"></p>
    </section>

    <div id="result" aria-live="polite"></div>

    <section class="cards">
      <article class="card">
        <div class="card-head"><h2>Today</h2><span class="badge demo" id="demo-badge" hidden>DEMO</span></div>
        <ul class="plain" id="today">
          <li><div class="skeleton"></div></li>
          <li><div class="skeleton short"></div></li>
        </ul>
      </article>

      <article class="card">
        <div class="card-head"><h2>Activity</h2><span class="badge" id="chart-badge">7 DAYS</span></div>
        <svg class="chart" id="chart" viewBox="0 0 300 130" preserveAspectRatio="none" aria-label="Activity chart">
          <line class="grid" x1="0" y1="32" x2="300" y2="32"/>
          <line class="grid" x1="0" y1="65" x2="300" y2="65"/>
          <line class="grid" x1="0" y1="98" x2="300" y2="98"/>
          <path class="area" id="chart-area" d=""/>
          <path class="line" id="chart-line" d=""/>
        </svg>
      </article>

      <article class="card wide">
        <div class="card-head"><h2>Script check</h2><span class="badge">CHECKER</span></div>
        <textarea id="script" placeholder="Paste a script or text to check..." aria-label="Script to check"></textarea>
        <div class="row">
          <button class="btn primary" id="check">Check</button>
          <button class="btn secondary" id="clear">Clear</button>
        </div>
        <p class="error" id="check-error" role="alert"></p>
        <div id="check-out"></div>
      </article>
    </section>
  </main>

  <aside class="side right" id="right">
    <div class="side-head">
      <div>
        <h2>Agents</h2>
        <p class="muted small" id="agent-count">Loading...</p>
      </div>
      <button class="icon-btn only-mobile" id="close-right" aria-label="Close agents">&#10005;</button>
    </div>
    <div class="agents" id="agents">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton short"></div>
    </div>
    <div class="label">Approvals</div>
    <div class="approvals" id="approvals">
      <p class="muted small">Nothing waiting.</p>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="overlay" id="login" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <h2 id="login-title">Connect to MAY</h2>
    <p class="muted small">Enter your dashboard token.</p>
    <input type="password" id="token" placeholder="Token" autocomplete="current-password" aria-label="Token">
    <button class="btn primary" id="connect" style="width:100%">Connect</button>
    <p class="error" id="login-error" role="alert"></p>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="dashboard.js"></script>
</body>
</html>
